# Baut die App bei jedem Push auf "main" und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Repository > Settings > Pages > Source: "GitHub Actions".
name: Veröffentlichen auf GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Daten prüfen
        run: python3 tools/pruefe_daten.py

      - name: App veröffentlichen
        run: dotnet publish src/TripleA/TripleA.csproj -c Release -o publish

      - name: Für GitHub Pages vorbereiten
        run: |
          # Unterseiten (z.B. /Triple-A/tiere/hecht) beim direkten Aufruf an die App weiterleiten
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Ordner mit Unterstrich (_framework) nicht von Jekyll ausfiltern lassen
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
